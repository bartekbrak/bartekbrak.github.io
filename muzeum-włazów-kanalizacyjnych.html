    .skip-link {

  <script>
    (() => {
      const accessKey = 'manhole-museum-access';
      let accessGranted = false;
      try { accessGranted = document.cookie.split('; ').includes(`${accessKey}=granted`); } catch { /* Cookies may be unavailable for file:// URLs. */ }
      try { accessGranted ||= localStorage.getItem(accessKey) === 'granted'; } catch { /* Some local-file browser contexts disable storage. */ }
      if (accessGranted) document.documentElement.classList.remove('access-locked');

      const input = document.getElementById('access-password');
      input.addEventListener('input', () => {
        if (input.value !== 'brak') return;
        try { localStorage.setItem(accessKey, 'granted'); } catch { /* Storage is optional. */ }
        try { document.cookie = `${accessKey}=granted; Max-Age=315360000; Path=/; SameSite=Lax`; } catch { /* file:// does not support cookies in every browser. */ }
        document.documentElement.classList.remove('access-locked');
      });
    })();

    (() => {
      const filters = [...document.querySelectorAll('[data-filter-kind]')];
      const cards = [...document.querySelectorAll('.gallery > li')];
      const count = document.querySelector('.collection-heading');
      const state = { author: '', location: '' };

      function applyFilters() {
        let visible = 0;
        cards.forEach(item => {
          const card = item.querySelector('.card');
          const matches = (!state.author || card.dataset.author === state.author)
            && (!state.location || card.dataset.location === state.location);
          item.hidden = !matches;
          if (matches) visible += 1;
        });
        count.textContent = `Pokazano ${visible} z ${cards.length} eksponatów`;
      }

      filters.forEach(button => button.addEventListener('click', () => {
        const { filterKind, filterValue } = button.dataset;
        state[filterKind] = filterValue;
        filters.filter(item => item.dataset.filterKind === filterKind).forEach(item => {
          item.setAttribute('aria-pressed', String(item === button));
        });
        applyFilters();
      }));
    })();

    (() => {
      const dialog = document.querySelector('.lightbox');
      const image = document.getElementById('lightbox-image');
      const title = document.getElementById('lightbox-title');
      const author = document.getElementById('lightbox-author');
      const location = document.getElementById('lightbox-location');
      const date = document.getElementById('lightbox-date');
      const description = document.getElementById('lightbox-description');
      const closeButton = dialog.querySelector('[data-lightbox-close]');
      const previousButton = dialog.querySelector('[data-lightbox-prev]');
      const nextButton = dialog.querySelector('[data-lightbox-next]');
      let activeButton = null;

      function visiblePhotos() {
        return [...document.querySelectorAll('[data-lightbox-open]')]
          .filter(button => !button.closest('li').hidden);
      }

      function showPhoto(button) {
        activeButton = button;
        image.src = button.dataset.image;
        image.alt = button.dataset.alt;
        title.textContent = button.dataset.title;
        author.textContent = button.dataset.author;
        location.textContent = button.dataset.location;
        date.dateTime = button.dataset.date;
        date.textContent = button.dataset.date.replaceAll('-', '.');
        const descriptionText = button.dataset.description;
        description.hidden = !descriptionText;
        description.querySelector('p').textContent = descriptionText;
        const canNavigate = visiblePhotos().length > 1;
        previousButton.disabled = !canNavigate;
        nextButton.disabled = !canNavigate;
      }

      function navigate(direction) {
        const photos = visiblePhotos();
        if (photos.length < 2) return;
        const index = photos.indexOf(activeButton);
        showPhoto(photos[(index + direction + photos.length) % photos.length]);
      }

      document.querySelectorAll('[data-lightbox-open]').forEach(button => {
        button.addEventListener('click', () => {
          showPhoto(button);
          dialog.showModal();
          document.body.classList.add('lightbox-open');
          closeButton.focus();
        });
      });
      closeButton.addEventListener('click', () => dialog.close());
      previousButton.addEventListener('click', () => navigate(-1));
      nextButton.addEventListener('click', () => navigate(1));
      dialog.addEventListener('click', event => {
        if (event.target === dialog) dialog.close();
      });
      dialog.addEventListener('close', () => {
        document.body.classList.remove('lightbox-open');
        activeButton?.focus();
      });
      document.addEventListener('keydown', event => {
        if (!dialog.open) return;
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          navigate(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          navigate(1);
        }
      });
    })();

  </script>
