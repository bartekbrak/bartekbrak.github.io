    :root {
      color-scheme: light;
      --paper: #f6f3eb;
      --surface: #fcfaf5;
      --ink: #292b26;
      --muted: #65665d;
      --line: #ccc9be;
      --accent: #88452d;
      --photo: #e8e5dc;
      --heading: Georgia, 'Times New Roman', serif;
      --body: system-ui, sans-serif;
      --radius: 0;
      --border: 1px;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.6 var(--body);
    }
    a { color: var(--accent); text-underline-offset: .2em; }
    button { font: inherit; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }
    [hidden] { display: none !important; }
    .access-locked body { overflow: hidden; }
    .access-locked .page, .access-locked .skip-link {
      filter: blur(18px);
      pointer-events: none;
      user-select: none;
    }
    .access-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      place-items: center;
      padding: 1rem;
      background: rgb(244 239 100 / 20%);
    }
    .access-locked .access-gate { display: grid; }
    .access-form {
      width: min(100%, 24rem);
      padding: 2rem;
      border: 2px solid var(--ink);
      background: var(--surface);
      box-shadow: 7px 7px 0 var(--ink);
    }
    .access-form label {
      display: block;
      margin-bottom: .75rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .access-form input {
      width: 100%;
      min-height: 48px;
      padding: .65rem .8rem;
      border: 2px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: var(--paper);
      font: 1rem var(--body);
    }
    .skip-link {
      position: absolute;
      top: .5rem;
      left: 1rem;
      z-index: 1;
      padding: .75rem;
      background: var(--surface);
      transform: translateY(-200%);
    }
    .skip-link:focus { transform: translateY(0); }
    .page { max-width: 1800px; margin: auto; padding: 0 clamp(1rem, 3vw, 3rem); }
    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 0;
      border-bottom: var(--border) solid var(--ink);
    }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .mark { width: 2.5rem; height: 2.5rem; flex: none; color: var(--accent); }
    .eyebrow, .collection-heading, .number {
      font: .75rem/1.5 var(--body);
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .masthead a { font-size: .875rem; }
    .collection-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: .5rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .collection-heading { margin: 0; }
    .collection-bar p { margin: 0; color: var(--muted); font-size: .8rem; }
    .filters {
      display: grid;
      gap: .6rem;
      margin: 0 0 1.5rem;
      padding: 1rem;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; }
    .filter-label {
      min-width: 7rem;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .filter-row button {
      min-height: 40px;
      padding: .35rem .8rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--paper);
      cursor: pointer;
    }
    .filter-row button:hover { border-color: var(--accent); }
    .filter-row button[aria-pressed="true"] {
      border-color: var(--ink);
      color: var(--paper);
      background: var(--ink);
    }
    .filter-row button[data-author] {
      border: 2px solid var(--author-color);
      color: var(--author-color);
      background: var(--author-pastel);
      font-weight: 750;
    }
    .filter-row button[data-author][aria-pressed="true"] {
      border-color: var(--author-color);
      color: #fff;
      background: var(--author-color);
    }
    .filter-row button[data-location] {
      border: 5px solid var(--location-color);
      color: var(--ink);
      background: var(--location-pastel);
      font-weight: 750;
    }
    .filter-row button[data-location][aria-pressed="true"] {
      color: #fff;
      background: var(--location-color);
    }
    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2rem 1.25rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .gallery > li { min-width: 0; }
    .card {
      height: 100%;
      margin: 0;
      background: var(--location-pastel, var(--surface));
      border: 5px solid var(--location-color, var(--accent));
      border-top-color: var(--location-color, var(--accent));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card[data-author="oh"], .filter-row button[data-author="oh"] { --author-color: #1d627c; --author-pastel: #c1e4f1; }
    .card[data-author="Karolina"], .filter-row button[data-author="Karolina"] { --author-color: #873c70; --author-pastel: #edc5df; }
    .card[data-author="Surri"], .filter-row button[data-author="Surri"] { --author-color: #356c38; --author-pastel: #c9e6c6; }

    .photo {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      color: inherit;
      background: var(--photo);
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: zoom-in;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      border-radius: inherit;
    }
    .photo:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
    .photo:focus-visible { position: relative; z-index: 1; }
    figcaption { padding: 1.1rem; overflow-wrap: anywhere; }
    .number { display: block; color: var(--accent); margin-bottom: .5rem; }
    h3 { margin: 0 0 1rem; font: 400 1.4rem/1.25 var(--heading); }
    dl { margin: 0; font-size: .8rem; }
    dl > div { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .5rem; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .description {

      padding-top: .75rem;
      margin: .9rem 0 0;
      font-size: .875rem;
      color: var(--muted);
    }
    body.lightbox-open { overflow: hidden; }
    .lightbox {
      width: min(1500px, calc(100vw - 1rem));
      max-width: none;
      max-height: calc(100dvh - 1rem);
      padding: 0;
      overflow: auto;
      border: var(--border) solid var(--ink);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--surface);
      box-shadow: 8px 8px 0 var(--ink);
    }
    .lightbox::backdrop { background: rgb(0 0 0 / 78%); }
    .lightbox-top { display: flex; justify-content: flex-end; padding: .75rem; }
    .lightbox-close, .lightbox-nav {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--paper);
      cursor: pointer;
    }
    .lightbox-close { font-size: 1.5rem; line-height: 1; }
    .lightbox-stage {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: .5rem;
      padding: 0 1rem 1rem;
    }
    .lightbox-stage figure { min-width: 0; margin: 0; }
    .lightbox-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: min(82vh, calc(100dvh - 11rem));
      margin-inline: auto;
      object-fit: contain;
      background: var(--photo);
    }
    .lightbox figcaption { padding: 1.25rem .25rem .5rem; }
    .lightbox h2 { margin: 0 0 .75rem; font: 400 clamp(1.4rem, 3vw, 2rem)/1.2 var(--heading); }
    .lightbox dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem 1rem; }
    .lightbox dl > div { display: grid; grid-template-columns: 1fr; gap: 0; }
    .lightbox-description hr { margin: 1rem 0 .75rem; border: 0; border-top: 1px solid var(--line); }
    .lightbox-description p { margin: 0; color: var(--muted); }
    .lightbox-nav:disabled { opacity: .4; cursor: default; }
    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      border-top: var(--border) solid var(--ink);
      margin-top: 3rem;
      padding: 1.5rem 0 2rem;
      font-size: .8rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    @media (min-width: 600px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 900px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 1200px) { .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    @media (max-width: 600px) {

      .lightbox-stage { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: .25rem; padding: 0 .5rem .75rem; }
      .lightbox-nav { min-width: 40px; min-height: 48px; padding: 0; }

    /* Neobrutalist visual treatment. */
    :root[data-style="brutalist"] {

      --surface: #fffdf2;
      --ink: #191919;

      --accent: #7527b5;
      --line: #191919;

      .skip-link, .masthead a { display: none; }

</head>

      <button class="lightbox-nav" type="button" data-lightbox-prev aria-label="Poprzednie zdjęcie">←</button>
      <figure>
        <img class="lightbox-image" id="lightbox-image">
        <figcaption>
          <h2 id="lightbox-title"></h2>
          <dl>
            <div><dt>Numer eksponatu</dt><dd id="lightbox-number"></dd></div>
            <div><dt>Autor</dt><dd id="lightbox-author"></dd></div>

            <div><dt>Lokalizacja</dt><dd id="lightbox-location"></dd></div>
          </dl>
          <div class="lightbox-description" id="lightbox-description" hidden><hr><p></p></div>
        </figcaption>
      </figure>
      <button class="lightbox-nav" type="button" data-lightbox-next aria-label="Następne zdjęcie">→</button>
    </div>

  <script>
    (() => {
      const accessKey = 'manhole-museum-access';
      let accessGranted = false;
      try { accessGranted = document.cookie.split('; ').includes(`${accessKey}=granted`); } catch { /* Cookies may be unavailable for file:// URLs. */ }
      try { accessGranted ||= localStorage.getItem(accessKey) === 'granted'; } catch { /* Some local-file browser contexts disable storage. */ }
      if (accessGranted) document.documentElement.classList.remove('access-locked');

      const input = document.getElementById('access-password');
      input.addEventListener('input', () => {
        if (input.value !== 'brak') return;
        try { localStorage.setItem(accessKey, 'granted'); } catch { /* Storage is optional. */ }
        try { document.cookie = `${accessKey}=granted; Max-Age=315360000; Path=/; SameSite=Lax`; } catch { /* file:// does not support cookies in every browser. */ }
        document.documentElement.classList.remove('access-locked');
      });
    })();

    (() => {
      const filters = [...document.querySelectorAll('[data-filter-kind]')];
      const cards = [...document.querySelectorAll('.gallery > li')];
      const count = document.querySelector('.collection-heading');
      const state = { author: '', location: '' };

      function applyFilters() {
        let visible = 0;
        cards.forEach(item => {
          const card = item.querySelector('.card');
          const matches = (!state.author || card.dataset.author === state.author)
            && (!state.location || card.dataset.location === state.location);
          item.hidden = !matches;
          if (matches) visible += 1;
        });
        count.textContent = `Pokazano ${visible} z ${cards.length} eksponatów`;
        document.dispatchEvent(new CustomEvent('museum:filters-changed'));
      }

      filters.forEach(button => button.addEventListener('click', () => {
        const { filterKind, filterValue } = button.dataset;
        state[filterKind] = filterValue;
        filters.filter(item => item.dataset.filterKind === filterKind).forEach(item => {
          item.setAttribute('aria-pressed', String(item === button));
        });
        applyFilters();
      }));
    })();

    (() => {
      const dialog = document.querySelector('.lightbox');
      const image = document.getElementById('lightbox-image');
      const title = document.getElementById('lightbox-title');
      const number = document.getElementById('lightbox-number');
      const author = document.getElementById('lightbox-author');
      const location = document.getElementById('lightbox-location');
      const date = document.getElementById('lightbox-date');
      const description = document.getElementById('lightbox-description');
      const closeButton = dialog.querySelector('[data-lightbox-close]');
      const previousButton = dialog.querySelector('[data-lightbox-prev]');
      const nextButton = dialog.querySelector('[data-lightbox-next]');
      let activeButton = null;

      function visiblePhotos() {
        return [...document.querySelectorAll('.gallery > li:not([hidden]) [data-lightbox-open]')];
      }

      function updateNavigation() {
        const canNavigate = visiblePhotos().length > 1;
        previousButton.disabled = !canNavigate;
        nextButton.disabled = !canNavigate;
      }

      function showPhoto(button) {
        activeButton = button;
        image.src = button.dataset.image;
        title.textContent = button.dataset.title;
        number.textContent = button.dataset.number;
        author.textContent = button.dataset.author;
        location.textContent = button.dataset.location;
        date.dateTime = button.dataset.date;
        date.textContent = button.dataset.date.replaceAll('-', '.');
        const descriptionText = button.dataset.description;
        description.hidden = !descriptionText;
        description.querySelector('p').textContent = descriptionText;
        updateNavigation();
      }

      function navigate(direction) {
        const photos = visiblePhotos();
        if (photos.length < 2) return;
        const activeIndex = photos.indexOf(activeButton);
        const index = activeIndex === -1
          ? (direction > 0 ? -1 : 0)
          : activeIndex;
        showPhoto(photos[(index + direction + photos.length) % photos.length]);
      }

      document.addEventListener('museum:filters-changed', () => {
        const photos = visiblePhotos();
        if (dialog.open && activeButton && !photos.includes(activeButton) && photos.length) {
          showPhoto(photos[0]);
        } else {
          updateNavigation();
        }
      });

      document.querySelectorAll('[data-lightbox-open]').forEach(button => {
        button.addEventListener('click', () => {
          showPhoto(button);
          dialog.showModal();
          document.body.classList.add('lightbox-open');
          closeButton.focus();
        });
      });
      closeButton.addEventListener('click', () => dialog.close());
      previousButton.addEventListener('click', () => navigate(-1));
      nextButton.addEventListener('click', () => navigate(1));
      dialog.addEventListener('click', event => {
        if (event.target === dialog) dialog.close();
      });
      dialog.addEventListener('close', () => {
        document.body.classList.remove('lightbox-open');
        activeButton?.focus();
      });
      document.addEventListener('keydown', event => {
        if (!dialog.open) return;
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          navigate(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          navigate(1);
        }
      });
    })();

  </script>
